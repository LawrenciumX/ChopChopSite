        </a>
        <nav>
          <a href="index.html">Home</a>
          <a href="store.html">Shop</a>
          <a href="articles.html">Articles</a>
        </nav>

        <div>
        <button class="btn ghost" id="themeBtn">🌙</button>
          </div>
      </div>
</header>


<section class="section" style="padding-top:100px;">
  <div class="container">

    <div class="mobile-nav-pair" style="margin-bottom: .9rem; text-align: center">
      <a class="btn" href="./index.html">Home</a>
      <a class="btn" href="./store.html">Shop</a>
    </div>

    <!--<div style="display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin-bottom: .9rem;">
      <div class="searchbar" style="flex:1;">
        <span>🔎</span>
        <input id="searchInput" placeholder="Search articles " />
      </div>
    </div>-->

    <div style="display:flex; align-items:center; justify-content:center; margin:1rem auto; max-width:80%; gap:.5rem; border-bottom:1px solid var(--border); padding-bottom:.25rem;">
      <span style="font-size:1.1rem; opacity:0.8;">🔍</span>
      <input id="searchInput"
             placeholder="Search articles"
             style="flex:1; border:none; outline:none; background:none; color:var(--text); font-size:1rem; padding:.3rem 0;" />
    </div>
    <div id="gridVideos" class="grid videos"></div>
    <p id="noResults" class="muted" style="display:none; margin-top:.5rem;">No articles match that search.</p>
    <h1>Food Stories & Articles</h1>
    <p class="muted">Stories, cooking hacks, restaurant experiences and culture.</p>

    <div id="articlesList" style="margin-top:2rem;"></div>
  </div>
</section>

<footer>
  <div class="container foot">
    <p class="muted">&nbsp;&nbsp;&nbsp;© <span id="year"></span> Chop Chop. All rights reserved.</p>
    <div style="display:flex; gap:.6rem; flex-wrap:wrap;">

      <a class="btn ghost" href="https://mail.google.com/mail/?view=cm&fs=1&to=jcmarketing001@gmail.com" target="_blank">Contact</a>
    </div>
  </div>
</footer>

<script src="theme.js"></script>
<script>
  const articles = [
    {
      title: "How Immigrant Food Shapes Canada",
      date: "Nov 2025",
      img: "https://images.unsplash.com/photo-1478145046317-39f10e56b5e9?q=80&w=800&auto=format",
      desc: "Exploring how immigrant kitchens have shaped Canada’s culinary identity.",
      link: "articles/immigrant-food.html"
    },
    {
      title: "5 Budget Meals That Taste Expensive",
      date: "Oct 2025",
      img: "https://images.unsplash.com/photo-1512058564366-18510be2db19?q=80&w=800&auto=format",
      desc: "Delicious meals that stretch your dollar without sacrificing flavor.",
      link: "articles/budget-meals.html"
    },
    {
      title: "Why We Love Fusion Cooking",
      date: "Sep 2025",
      img: "https://images.unsplash.com/photo-1481391032119-d89fee407e44?q=80&w=1200&auto=format&fit=crop",
      desc: "Blending traditions to create something fresh and exciting.",
      link: "articles/fusion-meals.html"
    }
  ];

  const list = document.getElementById("articlesList");
  function renderArticles(items) {
    // Fade out
    list.classList.add("fade-out");

    setTimeout(() => {
      list.innerHTML = items.map(a => `
      <article class="article-card">
        <img src="${a.img}" alt="${a.title}">
        <div>
          <h3>${a.title}</h3>
          <p class="muted" style="margin:.25rem 0;">${a.date}</p>
          <p style="margin:.35rem 0 1rem;">${a.desc}</p>
          <a class="btn" href="${a.link}">Read →</a>
        </div>
      </article>
    `).join("");

    // Fade back in
    list.classList.remove("fade-out");

    // ✅ Re-enable transitions for new links
    enablePageTransitions();

  }, 400); // small delay to let fade-out apply
  }


  document.getElementById("searchInput").addEventListener("input", applySearch);
  function applySearch(){
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const filtered = q
            ? articles.filter(a =>
    a.title.toLowerCase().includes(q) ||
    a.desc.toLowerCase().includes(q)
  )
  : articles;

    document.getElementById("noResults").style.display = filtered.length ? "none" : "block";
    renderArticles(filtered);
  }

  // Run on page load
  renderArticles(articles);

</script>

</body>
</html>
